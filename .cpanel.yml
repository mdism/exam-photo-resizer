---
# MilesWeb (cPanel) deployment for https://tools.shaikhismail.com/exam-photo-resizer/
# Publishes ONLY the public/ folder into its own folder of the tools subdomain.
# HTTPS, security headers, bot blocking and the Turnstile check (api/verify.php) come from the tools-hub repo.
deployment:
  tasks:
    - export DEPLOYPATH=/home/qyotupjl/tools.shaikhismail.com/exam-photo-resizer/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R public/. $DEPLOYPATH
